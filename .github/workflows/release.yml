name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: win-arm64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained application
        run: >-
          dotnet publish src/ClamAVGui.App/ClamAVGui.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish/${{ matrix.rid }}

      - name: Install virtual X server
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Smoke-test Linux desktop startup
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 15s xvfb-run -a ./publish/linux-x64/ClamAVGui.App
          app_status=$?
          set -e
          if [ "$app_status" -ne 124 ]; then
            echo "Linux GUI exited before the startup smoke-test timeout (exit $app_status)."
            exit 1
          fi

      - name: Package archive
        shell: bash
        run: |
          asset="ClamAV-GUI-${GITHUB_REF_NAME}-${{ matrix.rid }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "./publish/${{ matrix.rid }}" && zip -q -r "../../${asset}" .)
            unzip -Z1 "${asset}" > archive-files.txt
            grep -Fx "ClamAVGui.App.exe" archive-files.txt
          else
            tar -czf "${asset}" -C "./publish/${{ matrix.rid }}" .
            tar -tzf "${asset}" > archive-files.txt
            grep -E '(^|/)ClamAVGui\.App$' archive-files.txt
          fi

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ClamAV-GUI-${{ matrix.rid }}
          path: ClamAV-GUI-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* --generate-notes
          fi

  windows-installer-smoke:
    name: Install and launch on Windows
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Checkout tagged installer
        uses: actions/checkout@v4

      - name: Install from the published release
        shell: powershell
        run: .\install.ps1

      - name: Verify and launch installed app
        shell: powershell
        run: |
          $ExePath = Join-Path $env:LOCALAPPDATA "ClamAV-GUI\ClamAVGui.App.exe"
          if (-not (Test-Path -LiteralPath $ExePath -PathType Leaf)) {
            throw "Installer did not place ClamAVGui.App.exe at $ExePath"
          }
          $App = Start-Process -FilePath $ExePath -PassThru
          Start-Sleep -Seconds 10
          $App.Refresh()
          if ($App.HasExited) {
            throw "Installed application exited during startup with code $($App.ExitCode)."
          }
          Stop-Process -Id $App.Id -Force
